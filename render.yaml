services:
  - type: web
    name: ecoshift-api
    env: python
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python data/data_ingest.py && python ml/train_model.py"
    startCommand: "uvicorn api.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PORT
        value: "8000"
      - key: PYTHON_VERSION
        value: "3.10.0"
      - key: MAX_CARBON_EMISSIONS
        value: "150.0"
      - key: PEAK_GRID_DRAW
        value: "250.0"
      - key: ALLOWED_ORIGINS
        value: "https://ecoshift-frontend.netlify.app"
